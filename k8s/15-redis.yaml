# 재고 서비스가 쓰는 Redis. 데모용이므로 emptyDir (파드 재시작 시 재고 초기화 → 재고 서비스가 1000 으로 다시 채움).
#
# OpenShift 용 sclorg 이미지를 쓴다 (임의 UID + 그룹 0 으로 동작).
# 비밀번호(redis-auth)는 git 에 두지 않고 scripts/deploy.sh 가 무작위로 만든다.
# 재고 서비스와 평문 RESP 로 통신해 eBPF 가 Redis 명령을 볼 수 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo-shop
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: quay.io/sclorg/redis-7-c9s:c9s
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-auth, key: REDIS_PASSWORD } }
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo-shop
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
