# 사내 DNS — 주 DNS ns1-corp-dns, 보조 DNS ns2-corp-dns
#   - DNS 포워더(47-dns-forwarder.yaml)가 결제·배송 서비스의 질의를 이 두 서버로 전달한다 (주 → 보조 순서)
#   - 두 서버는 같은 존(corp-dns-zone ConfigMap)을 읽는다 = 주 → 보조 존 복제가 끝난 상태
#   - 루트(.) 존을 권한 있게 맡으므로 등록되지 않은 이름에는 NXDOMAIN 을 답한다
#   - 로그는 CoreDNS 기본 형식 (클라이언트 IP:포트, 질의 ID, 질의, 응답 코드, 소요시간) — 어느 서버 로그인지는 파드 이름으로 구분
#   - demo-infra 는 인바운드 기본 차단(55-network-isolation.yaml)이라 DNS 포워더 → 사내 DNS 를 허용한다
#     (결제 서비스 파드도 허용: ./demo.sh pg-status·check 가 서버별로 직접 조회해 보는 점검용)
# 존 ConfigMap(corp-dns-zone)은 레코드를 바꿀 수 있도록 매니페스트가 아니라 스크립트(scripts/corpdns.sh)가 만든다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: corp-dns-corefile
  namespace: demo-infra
data:
  Corefile.primary: |
    .:1053 {
        file /etc/coredns/zone/db.corp . {
            reload 2s
        }
        log
        errors
    }
  Corefile.secondary: |
    .:1053 {
        file /etc/coredns/zone/db.corp . {
            reload 2s
        }
        log
        errors
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ns1-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: primary }
spec:
  serviceName: ns1-corp-dns
  replicas: 1
  selector:
    matchLabels: { app: corp-dns, dns-role: primary }
  template:
    metadata:
      labels: { app: corp-dns, dns-role: primary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        __NONOCP_RUN_AS_USER__
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile.primary"]
          ports:
            - { name: dns-udp, containerPort: 1053, protocol: UDP }
            - { name: dns-tcp, containerPort: 1053, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # coredns 바이너리의 파일 capability 때문에 NET_BIND_SERVICE 를 남긴다 — 이것만 빼면 'exec /coredns: operation not permitted'.
            # NET_BIND_SERVICE 는 restricted-v2 SCC / Pod Security restricted 가 추가를 허용하는 유일한 capability
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
            - { name: zone, mountPath: /etc/coredns/zone, readOnly: true }
      volumes:
        - name: corefile
          configMap: { name: corp-dns-corefile }
        - name: zone
          configMap: { name: corp-dns-zone }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ns2-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: secondary }
spec:
  serviceName: ns2-corp-dns
  replicas: 1
  selector:
    matchLabels: { app: corp-dns, dns-role: secondary }
  template:
    metadata:
      labels: { app: corp-dns, dns-role: secondary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        __NONOCP_RUN_AS_USER__
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile.secondary"]
          ports:
            - { name: dns-udp, containerPort: 1053, protocol: UDP }
            - { name: dns-tcp, containerPort: 1053, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
            - { name: zone, mountPath: /etc/coredns/zone, readOnly: true }
      volumes:
        - name: corefile
          configMap: { name: corp-dns-corefile }
        - name: zone
          configMap: { name: corp-dns-zone }
---
apiVersion: v1
kind: Service
metadata:
  name: ns1-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: primary }
spec:
  selector: { app: corp-dns, dns-role: primary }
  ports:
    - { name: dns-udp, port: 53, targetPort: 1053, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: ns2-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: secondary }
spec:
  selector: { app: corp-dns, dns-role: secondary }
  ports:
    - { name: dns-udp, port: 53, targetPort: 1053, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-corp-dns-from-clients
  namespace: demo-infra
  labels: { demo.observ/policy: isolation }
spec:
  podSelector:
    matchLabels: { app: corp-dns }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dns-forwarder }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: demo-shop }
          podSelector:
            matchLabels: { app: payment-service }
      ports:
        - { protocol: UDP, port: 1053 }
        - { protocol: TCP, port: 1053 }
