# 사내 DNS — 주 DNS ns1-corp-dns, 보조 DNS ns2-corp-dns
#   - 결제 서비스(PG 도메인)와 배송 서비스(택배사 도메인)는 이 두 서버를 파드의 DNS 서버로 쓴다 (주 → 보조 순서)
#   - 두 서버는 같은 존(corp-dns-zone ConfigMap)을 읽는다 = 주 → 보조 존 복제가 끝난 상태
#   - 루트(.) 존을 권한 있게 맡으므로 등록되지 않은 이름에는 NXDOMAIN 을 답한다
#   - cluster.local 은 클러스터 DNS 로 전달한다 (결제 서비스가 회원 서비스를 찾을 수 있게)
#   - 로그에 질의마다 서버 이름이 찍힌다 → 주 DNS 파드를 지우면 질의가 보조 DNS 로 넘어가는 것이 보인다
#   - demo-infra 는 인바운드 기본 차단(55-network-isolation.yaml)이라 결제·배송 → 사내 DNS 허용 정책을 둔다
# 존 ConfigMap(corp-dns-zone)은 레코드를 바꿀 수 있도록 매니페스트가 아니라 스크립트(scripts/corpdns.sh)가 만든다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: corp-dns-corefile
  namespace: demo-infra
data:
  Corefile.primary: |
    cluster.local:1053 {
        forward . /etc/resolv.conf
        cache 30
        log . "{remote} → ns1-corp-dns(primary) {type} {name} {rcode} {duration} (클러스터 DNS 로 전달)"
        errors
    }
    .:1053 {
        file /etc/coredns/zone/db.corp . {
            reload 2s
        }
        log . "{remote} → ns1-corp-dns(primary) {type} {name} {rcode} {duration}"
        errors
    }
  Corefile.secondary: |
    cluster.local:1053 {
        forward . /etc/resolv.conf
        cache 30
        log . "{remote} → ns2-corp-dns(secondary) {type} {name} {rcode} {duration} (클러스터 DNS 로 전달)"
        errors
    }
    .:1053 {
        file /etc/coredns/zone/db.corp . {
            reload 2s
        }
        log . "{remote} → ns2-corp-dns(secondary) {type} {name} {rcode} {duration}"
        errors
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ns1-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: primary }
spec:
  serviceName: ns1-corp-dns
  replicas: 1
  selector:
    matchLabels: { app: corp-dns, dns-role: primary }
  template:
    metadata:
      labels: { app: corp-dns, dns-role: primary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        __NONOCP_RUN_AS_USER__
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile.primary"]
          ports:
            - { name: dns-udp, containerPort: 1053, protocol: UDP }
            - { name: dns-tcp, containerPort: 1053, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # coredns 바이너리의 파일 capability 때문에 NET_BIND_SERVICE 를 남긴다 — 이것만 빼면 'exec /coredns: operation not permitted'.
            # NET_BIND_SERVICE 는 restricted-v2 SCC / Pod Security restricted 가 추가를 허용하는 유일한 capability
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
            - { name: zone, mountPath: /etc/coredns/zone, readOnly: true }
      volumes:
        - name: corefile
          configMap: { name: corp-dns-corefile }
        - name: zone
          configMap: { name: corp-dns-zone }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ns2-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: secondary }
spec:
  serviceName: ns2-corp-dns
  replicas: 1
  selector:
    matchLabels: { app: corp-dns, dns-role: secondary }
  template:
    metadata:
      labels: { app: corp-dns, dns-role: secondary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        __NONOCP_RUN_AS_USER__
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile.secondary"]
          ports:
            - { name: dns-udp, containerPort: 1053, protocol: UDP }
            - { name: dns-tcp, containerPort: 1053, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
            - { name: zone, mountPath: /etc/coredns/zone, readOnly: true }
      volumes:
        - name: corefile
          configMap: { name: corp-dns-corefile }
        - name: zone
          configMap: { name: corp-dns-zone }
---
apiVersion: v1
kind: Service
metadata:
  name: ns1-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: primary }
spec:
  selector: { app: corp-dns, dns-role: primary }
  ports:
    - { name: dns-udp, port: 53, targetPort: 1053, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: ns2-corp-dns
  namespace: demo-infra
  labels: { app: corp-dns, dns-role: secondary }
spec:
  selector: { app: corp-dns, dns-role: secondary }
  ports:
    - { name: dns-udp, port: 53, targetPort: 1053, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-corp-dns-from-clients
  namespace: demo-infra
  labels: { demo.observ/policy: isolation }
spec:
  podSelector:
    matchLabels: { app: corp-dns }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: demo-shop }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [payment-service, delivery-service] }
      ports:
        - { protocol: UDP, port: 1053 }
        - { protocol: TCP, port: 1053 }
