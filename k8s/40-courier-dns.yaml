# 택배사 도메인 전용 DNS. "택배사가 IP 를 바꿨다"를 흉내 내기 위해 hosts 한 줄만 바꾼다.
#   - 도메인 하나에 IP 는 항상 1개 (여러 개면 실패 목적지가 도메인:443 으로 합쳐진다)
#   - TTL 5초 → 배송 서비스가 매 요청 DNS 를 새로 조회
#   - 그 외 이름은 클러스터 DNS 로 forward
# 바인딩 권한이 필요 없도록 1053 에서 듣고 Service 가 53 → 1053 으로 연결한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: courier-dns-corefile
  namespace: demo-infra
data:
  Corefile: |
    __COURIER_DOMAIN__:1053 {
        hosts /etc/coredns/hosts/courier.hosts {
            ttl 5
            reload 5s
        }
        log
        errors
    }
    .:1053 {
        forward . /etc/resolv.conf
        cache 30
        errors
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: courier-hosts
  namespace: demo-infra
data:
  courier.hosts: |
    __COURIER_OLD_IP__ __COURIER_DOMAIN__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-dns
  namespace: demo-infra
  labels: { app: courier-dns }
spec:
  replicas: 1
  selector:
    matchLabels: { app: courier-dns }
  template:
    metadata:
      labels: { app: courier-dns }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - { name: dns-udp, containerPort: 1053, protocol: UDP }
            - { name: dns-tcp, containerPort: 1053, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
            - { name: hosts, mountPath: /etc/coredns/hosts, readOnly: true }
      volumes:
        - name: corefile
          configMap: { name: courier-dns-corefile }
        - name: hosts
          configMap: { name: courier-hosts }
---
apiVersion: v1
kind: Service
metadata:
  name: courier-dns
  namespace: demo-infra
spec:
  selector: { app: courier-dns }
  ports:
    - { name: dns-udp, port: 53, targetPort: 1053, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP }
