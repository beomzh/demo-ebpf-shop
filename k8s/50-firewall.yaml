# "사내 방화벽" — 배송 서비스의 외부 나가는 연결(egress) 허용 목록.
# OpenShift OVN-Kubernetes, Calico, Cilium 등 NetworkPolicy 를 집행하는 CNI 가 필요하다.
# 허용되지 않은 목적지로의 SYN 은 조용히 버려진다(drop) → 배송 서비스 connect 가 5초 뒤 타임아웃.
#
# 규칙 목록 보기:  kubectl -n demo-shop get netpol -l demo.observ/firewall=egress
#
# 1) 기본 규칙: 배송 서비스는 사내 DNS(주·보조) 질의만 허용 → 그 밖의 모든 나가는 연결 차단
#    cluster 모드: demo-infra 의 사내 DNS 파드(ns1/ns2-corp-dns). Service 53 → 파드 1053 으로 DNAT 되므로 파드 포트 1053
#    bastion·corporate 모드: 사내 DNS IP 2개의 53
#    (__CORP_DNS_PEERS__ / __CORP_DNS_PORT__ 는 scripts/lib.sh render 가 모드에 맞게 채운다)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fw-delivery-default
  namespace: demo-shop
  labels:
    demo.observ/firewall: egress
  annotations:
    demo.observ/description: "배송 서비스 egress 기본 규칙: 사내 DNS 만 허용, 그 외 차단"
spec:
  podSelector:
    matchLabels: { app: delivery-service }
  policyTypes: [Egress]
  egress:
    - to: __CORP_DNS_PEERS__
      ports:
        - { protocol: UDP, port: __CORP_DNS_PORT__ }
        - { protocol: TCP, port: __CORP_DNS_PORT__ }
---
# 2) 택배사 API 허용 — 등록 당시의 IP(예전 IP) 만 허용되어 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fw-allow-courier-__COURIER_OLD_IP_DASHED__
  namespace: demo-shop
  labels:
    demo.observ/firewall: egress
  annotations:
    demo.observ/description: "택배사 API (__COURIER_DOMAIN__) __COURIER_OLD_IP__:443 허용"
spec:
  podSelector:
    matchLabels: { app: delivery-service }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: __COURIER_OLD_IP__/32 }
      ports:
        - { protocol: TCP, port: 443 }
