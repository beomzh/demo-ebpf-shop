# 배송 서비스 (Python) — 모니터링이 전혀 없는 서비스.
# 택배사 도메인은 사내 DNS(주·보조)에 등록된 A 레코드 "IP 1개"로 조회한다 (dnsPolicy: None).
#   - 배송 서비스가 쓰는 DNS 는 사내 DNS 뿐이다 (택배사 외에는 이름 조회를 하지 않음. 방화벽도 DNS·택배사만 허용)
#   - ndots:1 + search 없음 → api.courier.example 을 바로 조회해 NXDOMAIN 이 0 으로 유지된다.
#   - timeout:2 attempts:1 → 주 DNS 가 응답하지 않으면 2초 뒤 보조 DNS 로 (결제 서비스와 같은 기준)
#   - __CORP_DNS_PRIMARY__/SECONDARY 는 scripts/deploy.sh 가 채운다 (cluster 모드: ns1/ns2-corp-dns 의 ClusterIP)
# 택배사 TLS 인증서는 courier-ca 시크릿의 사설 CA 로 검증한다 (시크릿이 없으면 기동하지 않음).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: demo-shop
  labels: { app: delivery-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: delivery-service }
  template:
    metadata:
      labels: { app: delivery-service }
      annotations:
        # 외부 API 사설 CA 지문. CA 가 바뀌면 값이 달라져 deploy 때 파드가 재시작된다 (CA 는 기동할 때 읽음)
        demo.observ/ca-sha256: "__CA_SHA256__"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      dnsPolicy: None
      dnsConfig:
        nameservers: ["__CORP_DNS_PRIMARY__", "__CORP_DNS_SECONDARY__"]
        options:
          - { name: ndots, value: "1" }
          - { name: timeout, value: "2" }
          - { name: attempts, value: "1" }
      containers:
        - name: delivery-service
          image: __REGISTRY__/shop-delivery-service:__TAG__
          imagePullPolicy: Always
          env:
            - { name: COURIER_HOST, value: "__COURIER_DOMAIN__" }
            - { name: COURIER_PORT, value: "443" }
            - { name: COURIER_TIMEOUT_SECONDS, value: "5" }
            - { name: COURIER_CA_FILE, value: "/etc/courier-ca/ca.crt" }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: courier-ca
              mountPath: /etc/courier-ca
              readOnly: true
      volumes:
        - name: courier-ca
          secret:
            secretName: courier-ca
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: demo-shop
spec:
  selector: { app: delivery-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
