# ── 결제 (Node.js) — 회원 호출 ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo-shop
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
      annotations:
        # 외부 API(PG) 사설 CA 지문. CA 가 바뀌면 deploy 때 파드가 재시작된다
        demo.observ/ca-sha256: "__CA_SHA256__"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      # 이 파드의 DNS 서버 = DNS 포워더(demo-infra/dns-forwarder). 앱은 평범하게 OS 리졸버를 쓴다
      #   - 포워더가 PG 도메인은 사내 DNS(주 → 보조)로, cluster.local(회원 서비스 FQDN)은 클러스터 DNS 로 전달한다
      #   - timeout 3초, attempts 1 → 사내 DNS 가 모두 응답하지 않으면 약 3초 뒤 실패 (주문의 결제 호출 제한 6초 안)
      #   - ndots:1 + search 없음 → PG 도메인을 한 번만 조회 (search 접미사를 붙인 불필요한 NXDOMAIN 없음)
      dnsPolicy: None
      dnsConfig:
        nameservers: ["__DNS_FORWARDER_IP__"]
        options:
          - { name: ndots, value: "1" }
          - { name: timeout, value: "3" }
          - { name: attempts, value: "1" }
      containers:
        - name: payment-service
          image: __REGISTRY__/shop-payment-service:__TAG__
          imagePullPolicy: Always
          env:
            - { name: MEMBER_URL, value: "http://member-service.demo-shop.svc.cluster.local:8080" }
            - { name: PG_DOMAIN, value: "__PG_DOMAIN__" }
            - { name: PG_CA_FILE, value: "/etc/demo-ca/ca.crt" }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: demo-ca, mountPath: /etc/demo-ca, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: demo-ca
          secret: { secretName: courier-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: demo-shop
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }

