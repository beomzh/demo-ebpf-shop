# 쇼핑몰 서비스 (배송 서비스는 30-delivery.yaml).
#   게이트웨이(C#) · 회원(Java) · 상품(Go) · 재고(Ruby) · 주문(Java) · 결제(Node.js) · 알림(PHP)
# 모니터링 SDK·에이전트·사이드카·어노테이션을 일부러 하나도 두지 않는다.
# 프로브는 tcpSocket 으로 두어 kubelet 의 HTTP 요청이 지표에 섞이지 않게 한다.
#
# 호출 관계 (모든 서비스가 요청을 받고, 다른 서비스를 호출한다):
#   loadgen → gateway ─┬→ product → inventory → Redis
#                      ├→ member → MySQL
#                      └→ order ─┬→ member → MySQL
#                                ├→ inventory → Redis
#                                ├→ payment → member, 외부 PG사 (승인, HTTPS — PG 도메인은 사내 DNS 로 조회)
#                                ├→ notification → member
#                                └→ delivery → 외부 택배사 (HTTPS)
#
# 보안: restricted-v2 SCC / Pod Security restricted 를 만족한다.
#   - runAsUser 는 지정하지 않는다 (OpenShift 가 네임스페이스 범위의 임의 UID 를 부여)
#   - 루트 파일시스템 읽기 전용. 임시파일이 필요한 런타임을 위해 /tmp 만 emptyDir 로 연다
#   - ServiceAccount 토큰 미마운트 (쿠버네티스 API 를 쓰지 않음)
# ── 게이트웨이 (C# / .NET) — 입구. loadgen 이 호출 ─────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: demo-shop
  labels: { app: gateway-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway-service }
  template:
    metadata:
      labels: { app: gateway-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway-service
          image: __REGISTRY__/shop-gateway-service:__TAG__
          imagePullPolicy: Always
          env:
            - { name: PRODUCT_URL, value: "http://product-service:8080" }
            - { name: MEMBER_URL, value: "http://member-service:8080" }
            - { name: ORDER_URL, value: "http://order-service:8080" }
            - { name: TRACKING_TIMEOUT_SECONDS, value: "15" }
            - { name: CHECKOUT_TIMEOUT_SECONDS, value: "10" }
            - { name: DOTNET_gcServer, value: "0" }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: demo-shop
spec:
  selector: { app: gateway-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }

---
# ── 회원 (Java) — MySQL ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: demo-shop
  labels: { app: member-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: member-service }
  template:
    metadata:
      labels: { app: member-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: member-service
          image: __REGISTRY__/shop-member-service:__TAG__
          imagePullPolicy: Always
          env:
            - { name: DB_URL, value: "jdbc:mysql://mysql:3306/shop?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=2000" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mysql-auth, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-auth, key: MYSQL_PASSWORD } }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: demo-shop
spec:
  selector: { app: member-service }
