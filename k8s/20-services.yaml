# 회원(Java)·상품(Go)·주문(Java)·결제(Node.js) 서비스.
# 모니터링 SDK·에이전트·사이드카·어노테이션을 일부러 하나도 두지 않는다.
# 프로브는 tcpSocket 으로 두어 kubelet 의 HTTP 요청이 지표에 섞이지 않게 한다.
#
# 보안: restricted-v2 SCC / Pod Security restricted 를 만족한다.
#   - runAsUser 는 지정하지 않는다 (OpenShift 가 네임스페이스 범위의 임의 UID 를 부여)
#   - 루트 파일시스템 읽기 전용. JVM 이 쓰는 /tmp 만 emptyDir 로 연다
#   - ServiceAccount 토큰 미마운트 (쿠버네티스 API 를 쓰지 않음)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: shop
  labels: { app: member-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: member-service }
  template:
    metadata:
      labels: { app: member-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: member-service
          image: __REGISTRY__/shop-member-service:__TAG__
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/shop?useSSL=false&allowPublicKeyRetrieval=true
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mysql-auth, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-auth, key: MYSQL_PASSWORD } }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: shop
spec:
  selector: { app: member-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
