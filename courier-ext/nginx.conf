# 가상 외부 API — 택배사(api.courier.example)와 PG사(api.pg.example)를 한 nginx 가 응답한다.
# TLS SNI(요청한 도메인)로 서버 블록을 고른다. 첫 블록(PG)이 기본 서버다.
# run.sh 가 'listen 443 ssl;' 를 지정한 IP 들의 listen 줄로 바꿔서 띄운다.
# 응답의 served_by 에 접속한 서버 IP 가 찍혀 어느 IP 로 연결됐는지 확인할 수 있다.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── PG사 API (결제 서비스: 승인) ─────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/pg.crt;
        ssl_certificate_key /etc/nginx/certs/pg.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/payments/approve {
            default_type application/json;
            return 200 '{"pg":"DEMO-PG","status":"APPROVED","approvalNo":"$request_id","served_by":"$server_addr"}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }

    # ── 택배사 API (배송 서비스) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.courier.example;

        ssl_certificate     /etc/nginx/certs/courier.crt;
        ssl_certificate_key /etc/nginx/certs/courier.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/v1/tracking/(?<tracking_no>[A-Za-z0-9-]+)$ {
            default_type application/json;
            return 200 '{"trackingNo":"$tracking_no","carrier":"DEMO-EXPRESS","status":"IN_TRANSIT","location":"Seoul Hub","served_by":"$server_addr"}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }
}
